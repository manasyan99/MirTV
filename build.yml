name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Устанавливаем Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Собираем APK
        run: gradle assembleDebug --no-daemon

      - name: Переименовываем файл
        run: cp app/build/outputs/apk/debug/app-debug.apk MirTV.apk

      - name: Сохраняем APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MirTV-apk
          path: MirTV.apk

      - name: Публикуем APK в разделе Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Мир ТВ — сборка ${{ github.run_number }}
          files: MirTV.apk
